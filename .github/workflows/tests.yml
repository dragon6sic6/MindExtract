name: Tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Bundled tools
        run: |
          scripts/setup-tools.sh ytdlp
          # The tests never run ffmpeg; empty stand-ins satisfy the build.
          touch MindExtract/Resources/ffmpeg MindExtract/Resources/ffprobe
          chmod +x MindExtract/Resources/ffmpeg MindExtract/Resources/ffprobe

      - name: Build and test
        run: |
          xcodebuild -version
          xcodebuild test \
            -project MindExtract.xcodeproj \
            -scheme MindExtract \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO
